name: Build MFD CarPlay Image

on:
  push:
    # Trigger only when a version tag is pushed, e.g. V0.9.20 or v0.9.20
    tags:
      - 'V*'
      - 'v*'

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: write
      packages: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install dependencies
        run: |
          sudo apt update
          sudo apt install -y \
            qemu-user-static \
            unzip \
            wget \
            xz-utils \
            kpartx \
            dosfstools \
            rsync \
            jq

      - name: Download latest Raspberry Pi OS Lite (64bit)
        run: |
            wget -O raspios.img.xz -L https://downloads.raspberrypi.org/raspios_full_arm64_latest
            xz -d raspios.img.xz
            # Determine version from pushed tag (strip leading V/v). Fallback to run number.
            TAG=${GITHUB_REF#refs/tags/}
            VERSION=${TAG#V}
            VERSION=${VERSION#v}
            if [ -z "$VERSION" ]; then
              VERSION="0.9.$GITHUB_RUN_NUMBER"
            fi
            IMG_NAME="MFD-CarPlay${VERSION}.img"
            echo "IMG_NAME=$IMG_NAME" >> $GITHUB_ENV
            mv raspios.img "$IMG_NAME"

      - name: Expand image size
        run: |
            # Image um 4GB vergrößern
            truncate -s +4G "$IMG_NAME"

            # Loop Device neu setzen
            sudo losetup -d $(losetup -j "$IMG_NAME" | cut -d: -f1) 2>/dev/null || true
            sudo losetup -Pf "$IMG_NAME"
            LOOPDEV=$(losetup -j "$IMG_NAME" | cut -d: -f1)
            echo "LOOPDEV=$LOOPDEV" >> $GITHUB_ENV

            # Partition 2 auf 100% erweitern (non-interactive)
            sudo parted -s $LOOPDEV resizepart 2 100%

            # Filesystem prüfen & erweitern (non-interactive)
            sudo e2fsck -fy ${LOOPDEV}p2
            sudo resize2fs ${LOOPDEV}p2

      - name: Mount Image
        run: |
          sudo mkdir -p /mnt/rpi
          sudo mount ${LOOPDEV}p2 /mnt/rpi
          sudo mount ${LOOPDEV}p1 /mnt/rpi/boot

      - name: Prepare chroot environment
        run: |
          sudo cp /usr/bin/qemu-aarch64-static /mnt/rpi/usr/bin/
          sudo mount --bind /dev /mnt/rpi/dev
          sudo mount --bind /sys /mnt/rpi/sys
          sudo mount --bind /proc /mnt/rpi/proc

      - name: Copy install script
        run: |
          sudo cp install.sh /mnt/rpi/install.sh
          sudo chmod +x /mnt/rpi/install.sh

      - name: Copy firmware config correctly
        run: |
          # Sicherstellen, dass beide Orte identisch sind
          sudo mkdir -p /mnt/rpi/boot/firmware

          # config.txt auf die echte Boot-Partition (FAT)
          sudo cp config/config.txt /mnt/rpi/boot/config.txt

          # UND in das firmware-Verzeichnis im RootFS
          sudo cp config/config.txt /mnt/rpi/boot/firmware/config.txt

          # Optional: prüfen was wirklich existiert
          echo "=== BOOT CONTENT ==="
          ls -la /mnt/rpi/boot
          echo "=== FIRMWARE CONTENT ==="
          ls -la /mnt/rpi/boot/firmware

      - name: Execute install.sh inside image
        run: |
          sudo chroot /mnt/rpi /bin/bash -c "/install.sh"
          sudo rm /mnt/rpi/install.sh

      - name: Cleanup mounts
        run: |
          sudo umount /mnt/rpi/dev
          sudo umount /mnt/rpi/sys
          sudo umount /mnt/rpi/proc
          sudo umount /mnt/rpi/boot
          sudo umount /mnt/rpi
          sudo losetup -d $LOOPDEV

      - name: Compress image
        run: |
          xz -T0 -z "$IMG_NAME"

      - name: Set compressed filename
        run: |
          echo "COMPRESSED_NAME=${IMG_NAME}.xz" >> $GITHUB_ENV

      - name: Create Large Release (supports >2GB)
        uses: ading2210/gh-large-releases@v1
        with:
          files: ${{ env.COMPRESSED_NAME }}
          tag_name: build-${{ github.run_number }}
          name: MFD-CarPlay ${{ github.ref_name }}
          body: |
            This release contains the built image compressed with xz. The action will split large files
            and provide download URLs that reassemble on-the-fly via the configured Cloudflare Worker.
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Update config/os_list.json
        env:
          COMPRESSED_NAME: ${{ env.COMPRESSED_NAME }}
          IMG_NAME: ${{ env.IMG_NAME }}
        run: |
          set -e
          OWNER=${GITHUB_REPOSITORY%%/*}
          REPO=${GITHUB_REPOSITORY##*/}
          FILE="${COMPRESSED_NAME}"
          RELEASE_TAG="build-${GITHUB_RUN_NUMBER}"
          URL="https://gh-releases.ading2210.workers.dev/${OWNER}/${REPO}/releases/download/${RELEASE_TAG}/${FILE}"

          # Sizes (bytes) — handle both stat variants
          COMPRESSED_SIZE=0
          if [ -f "$FILE" ]; then
            if stat -c%s "$FILE" >/dev/null 2>&1; then
              COMPRESSED_SIZE=$(stat -c%s "$FILE")
            else
              COMPRESSED_SIZE=$(stat -f%z "$FILE")
            fi
          fi

          IMG_SIZE=0
          if [ -n "${IMG_NAME}" ] && [ -f "${IMG_NAME}" ]; then
            if stat -c%s "${IMG_NAME}" >/dev/null 2>&1; then
              IMG_SIZE=$(stat -c%s "${IMG_NAME}")
            else
              IMG_SIZE=$(stat -f%z "${IMG_NAME}")
            fi
          fi

          RELEASE_DATE=$(date -u +%Y-%m-%d)

          # Ensure jq is available (installed earlier, but be safe)
          if ! command -v jq >/dev/null 2>&1; then
            sudo apt-get update
            sudo apt-get install -y jq
          fi

          # Update JSON fields
          jq --arg url "$URL" --arg date "$RELEASE_DATE" --argjson csize $COMPRESSED_SIZE --argjson isize $IMG_SIZE \
            '.os_list[0].url = $url | .os_list[0].release_date = $date | .os_list[0].image_download_size = $csize | .os_list[0].image_size = $isize | .os_list[0].extract_size = $isize' \
            config/os_list.json > config/os_list.json.tmp && mv config/os_list.json.tmp config/os_list.json

          # Commit back to the repository's default branch
          DEFAULT_BRANCH=$(curl -s -H "Authorization: token ${GITHUB_TOKEN}" "https://api.github.com/repos/${GITHUB_REPOSITORY}" | grep -Po '"default_branch":\s*"\K[^"]+')
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git fetch origin ${DEFAULT_BRANCH}
          git checkout ${DEFAULT_BRANCH}
          git add config/os_list.json
          git commit -m "ci: update config/os_list.json for ${RELEASE_TAG}" || echo "no changes to commit"
          git push origin ${DEFAULT_BRANCH}
